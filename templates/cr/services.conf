{% filter indent(width=4) %}
flow-monitoring {
    version-ipfix {
        template ipv4 {
            flow-active-timeout 10;
            flow-inactive-timeout 10;
            template-refresh-rate {
                packets 1000;
                seconds 10;
            }
            option-refresh-rate {
                packets 480000;
                seconds 600;
            }
            ipv4-template;
        }
        template ipv6 {
            flow-active-timeout 10;
            flow-inactive-timeout 10;
            template-refresh-rate {
                packets 1000;
                seconds 10;
            }
            option-refresh-rate {
                packets 480000;
                seconds 600;
            }
            ipv6-template;
        }
    }
}
{% if rpm_probes | d({}) %}
rpm {
    {% for probe_name, probe_tests in rpm_probes.items() %}
    probe {{ probe_name | upper }} {
        {% for test_name, test_ips in probe_tests.items() %}
        test {{ test_name | upper }} {
          {% if test_name.endswith("4") %}
            probe-type icmp-ping;
            target address {{ test_ips.target }};
            source-address {{ test_ips.source }};
          {% else %}
            probe-type icmp6-ping;
            target inet6-address {{ test_ips.target }};
            inet6-options {
                source-address {{ test_ips.source }};
            }
          {% endif %}
            probe-count 15;
            probe-interval 3;
            test-interval 60;
            ttl 1;
        }
      {% endfor %}
    {% endfor %}
  }
}
{% endif %}
{% endfilter %}
